<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coral Trainer</title>
    <!-- Importing Tailwind via CDN for simplicity in this env -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="/src/main.js" defer></script>
  </head>
  <body class="bg-slate-900 text-white h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-800 p-4 shadow-md flex justify-between items-center z-10">
      <h1 class="text-xl font-bold text-coral-500 flex items-center gap-2">
        <span class="text-red-400">Coral</span> Trainer
      </h1>
      <div class="text-xs text-gray-400">v0.1.0</div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-auto p-6">

      <!-- View A: Setup -->
      <section id="view-setup" class="max-w-2xl mx-auto space-y-6">
        <div class="bg-slate-800 p-6 rounded-lg shadow-lg">
          <h2 class="text-lg font-semibold mb-4 border-b border-gray-700 pb-2">Project Setup</h2>

          <div class="grid grid-cols-1 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-400 mb-1">Project Name</label>
              <input type="text" id="project-name" class="w-full bg-slate-900 border border-gray-700 rounded px-3 py-2 focus:outline-none focus:border-red-400" placeholder="my-object-detection" value="my-model">
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Epochs</label>
                <input type="number" id="epochs" class="w-full bg-slate-900 border border-gray-700 rounded px-3 py-2 focus:outline-none focus:border-red-400" value="10">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Batch Size</label>
                <input type="number" id="batch-size" class="w-full bg-slate-900 border border-gray-700 rounded px-3 py-2 focus:outline-none focus:border-red-400" value="32">
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-400 mb-1">Dataset Path</label>
              <div class="flex gap-2">
                <input type="text" id="data-path" class="flex-1 bg-slate-900 border border-gray-700 rounded px-3 py-2 focus:outline-none focus:border-red-400" placeholder="/path/to/images">
                <button id="btn-select-data" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded text-sm transition">Browse</button>
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-400 mb-1">Output Directory</label>
              <div class="flex gap-2">
                <input type="text" id="output-dir" class="flex-1 bg-slate-900 border border-gray-700 rounded px-3 py-2 focus:outline-none focus:border-red-400" placeholder="./output">
                <button id="btn-select-output" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded text-sm transition">Browse</button>
              </div>
            </div>

            <div class="pt-4">
              <button id="btn-start" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded shadow-lg transition transform active:scale-95">
                Start Training
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- View B: Training -->
      <section id="view-training" class="hidden h-full flex flex-col max-w-4xl mx-auto">
        <div class="bg-slate-800 p-6 rounded-lg shadow-lg flex flex-col h-full">
          <div class="flex justify-between items-end mb-4">
             <h2 class="text-lg font-semibold">Training in Progress...</h2>
             <span id="status-text" class="text-sm text-yellow-400 animate-pulse">Initializing...</span>
          </div>

          <!-- Progress Bar -->
          <div class="w-full bg-slate-900 rounded-full h-4 mb-6 relative overflow-hidden">
            <div id="progress-bar" class="bg-gradient-to-r from-red-500 to-orange-500 h-4 rounded-full transition-all duration-500" style="width: 0%"></div>
          </div>

          <div class="grid grid-cols-3 gap-4 mb-6 text-center">
             <div class="bg-slate-900 p-3 rounded">
               <div class="text-xs text-gray-400">Epoch</div>
               <div id="metric-epoch" class="text-xl font-mono">0/0</div>
             </div>
             <div class="bg-slate-900 p-3 rounded">
               <div class="text-xs text-gray-400">Loss</div>
               <div id="metric-loss" class="text-xl font-mono">--</div>
             </div>
             <div class="bg-slate-900 p-3 rounded">
               <div class="text-xs text-gray-400">Accuracy</div>
               <div id="metric-acc" class="text-xl font-mono">--</div>
             </div>
          </div>

          <h3 class="text-sm font-semibold text-gray-400 mb-2">Live Logs</h3>
          <div id="log-container" class="flex-1 bg-slate-950 p-4 rounded font-mono text-xs text-gray-300 overflow-y-auto border border-slate-700">
            <!-- Logs will appear here -->
          </div>
        </div>
      </section>

      <!-- View C: Export -->
      <section id="view-export" class="hidden max-w-2xl mx-auto text-center pt-10">
        <div class="bg-slate-800 p-8 rounded-lg shadow-lg">
          <div class="text-green-400 text-6xl mb-4">✓</div>
          <h2 class="text-2xl font-bold text-white mb-2">Training Complete!</h2>
          <p class="text-gray-400 mb-8">Your model has been quantized and compiled for the Edge TPU.</p>

          <div class="bg-slate-900 p-4 rounded mb-6 text-left">
            <div class="text-xs text-gray-500 mb-1">Output Model:</div>
            <div id="final-model-path" class="text-sm font-mono text-green-300 break-all">...</div>
          </div>

          <div class="flex gap-4 justify-center">
            <button id="btn-open-folder" class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded font-semibold transition">
              Open Output Folder
            </button>
            <button id="btn-home" class="bg-slate-700 hover:bg-slate-600 px-6 py-3 rounded font-semibold transition">
              Back to Home
            </button>
          </div>
        </div>
      </section>

    </main>

  </body>
</html>
